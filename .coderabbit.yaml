# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
tone_instructions: >-
  Be direct, factual, and focused on regressions. Prioritize verifiable defects
  with their impact and a concrete fix. Skip style preferences already covered
  by Biome or Oxlint, and clearly separate risk, suggestion, and bug.

reviews:
  profile: "assertive"
  path_instructions:
    - path: "src/client.ts"
      instructions: |
        Check first the public HTTP contracts, the construction of EA URLs and parameters,
        input and response validation, retries, timeouts, cancellation, typed errors,
        events, cache, and deduplication of concurrent requests.
        Flag any compatibility regression in the public API and any loss of the name or cause
        of a transport error. The injectable transport must stay usable in tests.

    - path: "src/{schemas,index,constants,regions,errors,cache,events}.ts"
      instructions: |
        Treat Zod schemas, types, and exports as public library contracts.
        Check consistency between input/output types, runtime, and ESM exports, as well as
        backward compatibility. EA responses are undocumented: preserve the unknown fields
        allowed by loose objects, accept the documented historical representations, and do
        not invent guarantees for regionId or other upstream values.

    - path: "src/{drift,compatibility}.ts"
      instructions: |
        Check drift detection for false positives: envelopes, required fields, types,
        semver recommendations, and passed/drifted/unverified states must stay consistent.
        Live probes must stay explicit, sequential, and low volume, stop on access-control
        errors, and never expose a raw payload, identifier, or secret.

    - path: "tests/**/*.ts"
      instructions: |
        Require deterministic, fully offline tests through the injectable transport and the
        fixtures. Check the success, validation, error, timeout, AbortSignal, retry, cache,
        and unknown upstream field paths. Reject live network calls in the default suite
        and assertions that mirror the implementation without testing the public contract.

    - path: "tests/fixtures/**/*.json"
      instructions: |
        Check that fixtures stay minimal, realistic, and anonymized. Never accept a cookie,
        token, personal identifier, full live response dump, or sensitive data.

    - path: "tools/oxlint/anti-slop/**/*.ts"
      instructions: |
        Check the precision of the AST visitors, the TypeScript cases covered, duplicate
        diagnostics, and false positives. A rule must not force a less safe workaround,
        analyze its own vendored files, or weaken the public contracts of the SDK.

    - path: "docs/**/*.mdx"
      instructions: |
        Check that the documentation matches the current exports and behavior exactly,
        that ESM examples run on the minimum Node version, and that no unsupported EA
        capability is promised. Preserve the warnings about upstream stability, security,
        low volume, and the absence of authentication.

    - path: "README.md"
      instructions: |
        Check consistency with package.json, the public exports, and the Mintlify documentation.
        Examples must use the published API and must not suggest an unsupported runtime.

    - path: ".github/workflows/*.yml"
      instructions: |
        Check the supported Node versions, npm ci, the npm run check gate, reproducibility,
        and minimal permissions. The live EA probe must stay optional and never become
        a required condition of the standard CI.

    - path: "package.json"
      instructions: |
        Check consistency between engines, CI, ESM exports, published files, scripts, and lockfile.
        Flag any unnecessary runtime dependency and any unintended publishing change.
