name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "const version = require('./package.json').version; const expected = 'v' + version; if (process.env.RELEASE_TAG !== expected) { console.error('Expected release tag ' + expected + ', received ' + process.env.RELEASE_TAG); process.exit(1) }"

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run check

      - name: Publish package
        run: npm publish --access public

      - name: Verify publication
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm view "proclubs-sdk@${RELEASE_TAG#v}" version
