 name: EA FC Compatibility Check
 
 on:
   workflow_dispatch:
     inputs:
       platform:
         description: 'Target platform to probe'
         required: true
         default: 'common-gen5'
         type: choice
         options:
           - common-gen5
           - common-gen4
           - nx
 
 permissions:
   contents: read
 
 jobs:
   compatibility:
     name: Compatibility Probe (${{ inputs.platform }})
     runs-on: ubuntu-latest
     timeout-minutes: 10
 
     steps:
       - name: Checkout
         uses: actions/checkout@v7
 
       - name: Set up Node.js
         uses: actions/setup-node@v7
         with:
           node-version: 22
           cache: npm
 
       - name: Install dependencies
         run: npm ci
 
       - name: Run compatibility check
         env:
           TARGET_PLATFORM: ${{ inputs.platform }}
           COMPATIBILITY_REPORT_PATH: compatibility-report.json
         run: npm run check:compatibility
 
       - name: Upload sanitized compatibility report
         if: always()
         uses: actions/upload-artifact@v7
         with:
           name: compatibility-report-${{ inputs.platform }}
           path: compatibility-report.json
           if-no-files-found: ignore
